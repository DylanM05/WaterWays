stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

before_script:
  - docker info

build-server:
  stage: build
  script:
    - docker build -t waterways-server:latest ./Server
  tags:
    - docker

build-client:
  stage: build
  script:
    - docker build -t waterways-client:latest ./WaterWays
  tags:
    - docker

deploy:
  stage: deploy
  script:
    - docker-compose down
    - docker-compose up -d --build
  only:
    - main
    - subscription
  tags:
    - docker
