services:
  server:
    build: ./Server
    ports:
      - "42069:42069"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - waterways-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:42069/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  client:
    build: ./WaterWays
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    depends_on:
      server:
        condition: service_healthy
    networks:
      - waterways-network
    restart: unless-stopped

networks:
  waterways-network:
    driver: bridge
