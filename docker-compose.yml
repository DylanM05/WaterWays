services:
  server:
    build: ./Server
    ports:
      - "42069:42069"
    env_file:
      - ./Server/.env
    networks:
      - waterways-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://192.168.50.166:42069/health"]
      interval: 35s
      timeout: 30s
      retries: 3

  client:
    build:
      context: ./WaterWays
      args:
        - VITE_PUBLIC_CLERK_PUBLISHABLE_KEY=${VITE_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "5173:5173"
    env_file:
      - ./WaterWays/.env
    environment:
      - VITE_API_URL=http://192.168.50.166:42069
    depends_on:
      server:
        condition: service_healthy
    networks:
      - waterways-network
    restart: unless-stopped

networks:
  waterways-network:
    driver: bridge
