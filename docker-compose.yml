services:
  server:
    build: ./Server
    ports:
      - "42069:42069"
    env_file:
      - .env
    networks:
      - waterways-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:42069/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build: ./WaterWays
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://192.168.50.166:42069
    depends_on:
      server:
        condition: service_healthy  # Wait for server health check
    networks:
      - waterways-network
    restart: unless-stopped

networks:
  waterways-network:
    driver: bridge
