name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - subscription

jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker and Docker Compose
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io docker-compose

      - name: Deploy with environment
        run: |
          # Stop old containers
          docker stop waterways_server_1 waterways_client_1 2>/dev/null || true
          docker rm waterways_server_1 waterways_client_1 2>/dev/null || true
          
          # Write .env directly to host filesystem via docker
          docker run --rm -v "$(pwd):/workspace" -w /workspace alpine sh -c "cat > .env << 'ENVEOF'
          ${{ secrets.ENV_FILE }}
          ENVEOF"
          
          # Verify .env exists on host
          docker run --rm -v "$(pwd):/workspace" alpine cat /workspace/.env | head -n 1
          
          # Build and deploy
          docker-compose build --no-cache
          docker-compose up -d
          
          # Wait and verify
          sleep 10
          docker logs waterways_server_1 --tail 20
