name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - subscription

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install docker-compose
        run: |
          apt-get update -qq
          apt-get install -y -qq curl
          curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

      - name: Create .env files
        run: |
          cat > ./WaterWays/.env << 'EOF'
          ${{ secrets.CLIENT_ENV_FILE }}
          EOF
          cat > ./Server/.env << 'EOF'
          ${{ secrets.SERVER_ENV_FILE }}
          EOF
          cat > .env << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Debug env files
        run: |
          echo "=== Root .env ==="
          cat .env | sed 's/=.*/=***REDACTED***/g'
          echo ""
          echo "=== Client .env ==="
          cat ./WaterWays/.env | sed 's/=.*/=***REDACTED***/g'
          echo ""
          echo "=== Server .env ==="
          cat ./Server/.env | sed 's/=.*/=***REDACTED***/g'

      - name: Build images
        run: |
          export VITE_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.VITE_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
          docker-compose build --no-cache
        env:
          VITE_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Stop and remove old containers
        run: |
          docker-compose -p waterways down --remove-orphans || true
          docker stop waterways-server-1 waterways-client-1 2>/dev/null || true
          docker rm waterways-server-1 waterways-client-1 2>/dev/null || true

      - name: Deploy
        run: |
          docker-compose up -d

      - name: Show logs
        run: |
          sleep 15
          docker-compose logs --tail 50
