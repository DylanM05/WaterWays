name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - subscription

jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker and Docker Compose
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io docker-compose

      - name: Create .env files
        run: |
          cat > ./Server/.env << 'EOF'
          ${{ secrets.SERVER_ENV }}
          EOF
          cat > ./WaterWays/.env << 'EOF'
          ${{ secrets.CLIENT_ENV }}
          EOF
          echo "Server .env has $(wc -l < ./Server/.env) lines"
          cat ./Server/.env

      - name: Deploy Application
        run: |
          docker-compose down || true
          docker-compose up -d --build --force-recreate
