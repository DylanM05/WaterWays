name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - subscription

jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker and Docker Compose
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io docker-compose
          docker --version
          docker-compose --version
          
      - name: Create .env files on Docker host
        run: |
          # Create .env files in the workspace
          echo "${{ secrets.SERVER_ENV }}" > ./Server/.env
          echo "${{ secrets.CLIENT_ENV }}" > ./WaterWays/.env
          
          # Copy workspace to Docker host accessible location
          docker run --rm -v /tmp/waterways:/dest -v "$(pwd)":/src alpine cp -r /src/. /dest/
          
          # Verify files exist
          docker run --rm -v /tmp/waterways:/check alpine ls -la /check/Server/.env

      - name: Deploy Application
        run: |
          cd /tmp/waterways
          docker-compose down || true
          docker system prune -f
          docker-compose build --no-cache
          docker-compose up -d
