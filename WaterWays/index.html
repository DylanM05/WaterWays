<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/icons/icon-152x152.png" />
    
    <!-- App Icon for iOS/Safari -->
    <link rel="apple-touch-icon" href="./src/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="./src/assets/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./src/assets/icons/icon-180x180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="./src/assets/icons/icon-167x167.png">
    
    <!-- iOS Specific settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WaterWays">
    
    <!-- Android/Chrome PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F2F6F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#06171C" media="(prefers-color-scheme: dark)">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WaterWays</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
    <script>
      if (window.location.protocol === 'capacitor:') {
        document.documentElement.classList.add('capacitor-app');
      }

      // Set the theme before the first paint, so a dark-mode visit doesn't flash light.
      (function () {
        let isDark;
        try {
          const savedMode = localStorage.getItem('darkMode');
          isDark = savedMode !== null ? JSON.parse(savedMode) : window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        document.documentElement.classList.add(isDark ? 'dark' : 'light-theme');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
